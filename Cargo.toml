[package]
name = "zipcrawl"
version = "4.0.2"
edition = "2024"
authors = ["SirCesarium"]
description = "Ergonomic API/Cli for ZIP archives"
license = "MIT"
repository = "https://github.com/SirCesarium/zipcrawl"
readme = "README.md"
keywords = ["zip", "cli", "explorer", "grep", "tree"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
colored = { version = "3.1.1", optional = true }
miette = { version = "7.6.0", features = ["fancy"], optional = true }
regex = { version = "1.12.3", optional = true }
thiserror = "2.0.18"
# Deflate only (pure Rust: flate2/zlib-rs + zopfli) so the library tree stays
# free of C codecs and compiles for wasm32. Enable `full-zip` for every
# compression method zip supports.
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }
clap = { version = "4.6.1", features = ["derive"], optional = true }
glob = { version = "0.3.3", optional = true }
similar = { version = "3.1.1", optional = true }
minus = { version = "5.7.1", features = ["static_output"], optional = true }
syntect = { version = "5.3.0", features = ["default-fancy"], default-features = false, optional = true }
clap_complete = { version = "4.6.5", features = ["unstable-dynamic"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
toml = { version = "1.1", optional = true }

[features]
default = ["nerdfonts", "cli", "exec"]
nerdfonts = []
cli = [
    "dep:clap",
    "dep:clap_complete",
    "dep:colored",
    "dep:miette",
    "dep:regex",
    "dep:glob",
    "dep:similar",
    "dep:minus",
    "dep:syntect",
    # The shipped CLI should open any ZIP, not just deflate/stored ones.
    "full-zip",
]
exec = []
compress = []
serde = ["dep:serde", "dep:serde_json", "dep:toml"]
full-zip = [
    "zip/aes-crypto",
    "zip/bzip2",
    "zip/deflate64",
    "zip/lzma",
    "zip/ppmd",
    "zip/time",
    "zip/xz",
    "zip/zstd",
]

[[bin]]
name = "zipcrawl"
path = "src/main.rs"
required-features = ["cli"]

[dev-dependencies]
tempfile = "3.27.0"

[package.metadata.deb]
maintainer = "Cesarium <239650612+SirCesarium@users.noreply.github.com>"
copyright = "2026, Cesarium"
license-file = ["LICENSE", "0"]
section = "utility"
depends = "$auto"
extended-description = "Explore and stream ZIP archives from the terminal."
assets = [
    ["target/release/zipcrawl", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/zipcrawl/README.md", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/zipcrawl", dest = "/usr/bin/zipcrawl", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/licenses/zipcrawl/LICENSE", mode = "644" },
]
