[package]
name = "zipcrawl"
version = "1.1.2"
edition = "2024"
authors = ["SirCesarium"]
description = "Explore and stream ZIP archives without even extracting them."
license = "MIT"
repository = "https://github.com/SirCesarium/zipcrawl"
readme = "README.md"
keywords = ["zip", "cli", "explorer", "grep", "tree"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
colored = "3.1.1"
miette = { version = "7.6.0", features = ["fancy"] }
regex = "1.12.3"
thiserror = "2.0.18"
zip = "8.6.0"
clap = { version = "4.6.1", features = ["derive"], optional = true }
glob = "0.3.3"
similar = "3.1.0"
minus = { version = "5.6.1", features = ["static_output"] }

[features]
default = ["nerdfonts", "cli"]
nerdfonts = []
cli = ["dep:clap"]
